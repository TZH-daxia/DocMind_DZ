# DocMind DZ 入口配置 —— 由本项目自带的 nginx 容器（compose 服务 gateway）加载
#
# 定位：与同机其它站点（DocMind / 官网 / 客服）的 nginx **完全无关**，
#       不共用也不占用它们的 80/443，不加入它们的 Docker 网络。
#       容器内监听 443，宿主端口由 compose 的 DOCMIND_DZ_HTTPS_PORT 决定（默认 8444）。
#
# 对外地址：https://ai.wecanintl.com:8444/docmind_dz/...
#   - 复用 ai.wecanintl.com 现成的解析（指向本机），因此**不需要新增 DNS 记录**；
#   - 证书是泛域名 *.wecanintl.com，覆盖 ai.wecanintl.com，浏览器无警告；
#   - 端口与 DocMind 的 8443 错开，两个项目互不干扰。
#
# 生效：
#   docker compose up -d gateway           # 首次
#   docker exec docmind-dz-gateway nginx -t
#   docker exec docmind-dz-gateway nginx -s reload
#
# 前置条件：
#   1) 阿里云安全组：**放行宿主映射端口（默认 8444/TCP）**；
#   2) 证书：只读挂载现成的泛域名证书，续期后自动生效，无需新签。
#
# 因为不用标准端口，这里不做 HTTP→HTTPS 跳转，容器也不监听 80。

server {
    # 容器内固定 443；宿主端口在 compose 里映射（8444:443）
    listen 443 ssl;
    # 只此一个 server 块，它就是 8444 这个端口上的默认 server：
    # 凡是解析到本机、访问 8444 的域名都由它接（包括直接用 IP）。
    # 显式列出两个名字只为可读性；以后加了 docmind-dz 子域解析也不用改配置。
    server_name ai.wecanintl.com docmind-dz.wecanintl.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 上传体积上限：一次最多 5 个文件（DOCMIND_DZ_MAX_UPLOAD_FILES），
    # 单文件上限 50MB（DOCMIND_DZ_MAX_FILE_SIZE_MB），故总请求按 5×50MB 留余量。
    # 只按单文件大小配置会在大批量上传时被 nginx 拦成 413。
    # 若调大了应用侧上限，这里必须同步调大。
    client_max_body_size 256m;

    # ============ 对外唯一开放的入口：业务接口 ============
    # 完整前缀是 /docmind_dz/analysis/**（应用 Settings.api_prefix = /docmind_dz），
    # 所以调用方的接口基址是 https://ai.wecanintl.com:8444/docmind_dz
    location /docmind_dz/ {
        # 同一 compose 项目内的服务，按服务名互访
        proxy_pass http://docmind-dz:8010;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 清掉 keep-alive，否则 SSE 长连接会被上游提前断开
        proxy_set_header Connection "";

        # SSE 进度流：不缓冲。任务时间线依赖它实时下推事件，
        # 一旦被缓冲，前端/调用方看到的就是「进度条卡住不动」。
        proxy_buffering off;
        proxy_cache off;

        # 任务可能长时间停在模型调用甚至被暂停，连接不能按默认 60s 掐断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 探活：供监控使用。不需要就直接删掉这三行
    location = /health {
        access_log off;
        proxy_pass http://docmind-dz:8010/health;
    }

    # ============ 其余一律不对外 ============
    # 覆盖：内置前端（/ 、/static/**）、接口文档（/docs、/redoc、/openapi.json）。
    # 前端只用于联调，公网零暴露；要看走 SSH 隧道经宿主回环口访问：
    #   ssh -L 8010:127.0.0.1:8010 root@<服务器IP>
    #   本机浏览器打开 http://127.0.0.1:8010/
    # 隧道不经过 nginx，所以那边 / 、/static、/docs 都照旧可用。
    location / {
        return 404;
    }
}
