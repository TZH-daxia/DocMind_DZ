<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  把单证里常见的 Windows 中文字体名映射到镜像内已安装的开源中文字体。

  为什么需要：单证（尤其 ERP 导出的 xls / doc）几乎都指定「宋体」「仿宋」「微软雅黑」。
  镜像里没有这些字体时，fontconfig 会把 family 退化到 DejaVu Sans —— 它的拉丁字宽
  比宋体宽得多，LibreOffice 按这个度量算行宽，同样的内容换行变多、纵向溢出，
  转出的 PDF 页数因此比开发机（Windows，宋体齐全）多出好几张，表现为核对页
  「一份单证被拆成很多张页面图」。

  binding="same" 表示「当成同一个字体处理」：度量、行高都取替代字体，
  避免仅影响字形选择而布局仍按原字体计算。

  替代关系：
    SimSun / 宋体 / 仿宋 / 楷体 → AR PL UMing CN（明体，与宋体同为全宽 CJK）
    SimHei / 黑体 / 微软雅黑 / 等线 → WenQuanYi Zen Hei
  若两个包都没装，这些规则不生效（fontconfig 会忽略指向缺失字体的别名），
  构建期的 fonts-arphic-uming / fonts-wqy-zenhei 保证了它们存在。
-->
<fontconfig>

  <!-- ============ 宋体系列 → AR PL UMing CN ============ -->
  <match target="pattern">
    <test qual="any" name="family"><string>SimSun</string></test>
    <edit name="family" mode="assign" binding="same"><string>AR PL UMing CN</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>宋体</string></test>
    <edit name="family" mode="assign" binding="same"><string>AR PL UMing CN</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>NSimSun</string></test>
    <edit name="family" mode="assign" binding="same"><string>AR PL UMing CN</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>新宋体</string></test>
    <edit name="family" mode="assign" binding="same"><string>AR PL UMing CN</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>STSong</string></test>
    <edit name="family" mode="assign" binding="same"><string>AR PL UMing CN</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>华文宋体</string></test>
    <edit name="family" mode="assign" binding="same"><string>AR PL UMing CN</string></edit>
  </match>

  <!-- ============ 仿宋 → AR PL UMing CN ============ -->
  <match target="pattern">
    <test qual="any" name="family"><string>FangSong</string></test>
    <edit name="family" mode="assign" binding="same"><string>AR PL UMing CN</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>仿宋</string></test>
    <edit name="family" mode="assign" binding="same"><string>AR PL UMing CN</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>FangSong_GB2312</string></test>
    <edit name="family" mode="assign" binding="same"><string>AR PL UMing CN</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>STFangsong</string></test>
    <edit name="family" mode="assign" binding="same"><string>AR PL UMing CN</string></edit>
  </match>

  <!-- ============ 楷体 → AR PL UKai CN ============ -->
  <match target="pattern">
    <test qual="any" name="family"><string>KaiTi</string></test>
    <edit name="family" mode="assign" binding="same"><string>AR PL UKai CN</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>楷体</string></test>
    <edit name="family" mode="assign" binding="same"><string>AR PL UKai CN</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>STKaiti</string></test>
    <edit name="family" mode="assign" binding="same"><string>AR PL UKai CN</string></edit>
  </match>

  <!-- ============ 黑体 / 雅黑 / 等线 → WenQuanYi Zen Hei ============ -->
  <match target="pattern">
    <test qual="any" name="family"><string>SimHei</string></test>
    <edit name="family" mode="assign" binding="same"><string>WenQuanYi Zen Hei</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>黑体</string></test>
    <edit name="family" mode="assign" binding="same"><string>WenQuanYi Zen Hei</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Microsoft YaHei</string></test>
    <edit name="family" mode="assign" binding="same"><string>WenQuanYi Zen Hei</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Microsoft Yahei</string></test>
    <edit name="family" mode="assign" binding="same"><string>WenQuanYi Zen Hei</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>微软雅黑</string></test>
    <edit name="family" mode="assign" binding="same"><string>WenQuanYi Zen Hei</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>DengXian</string></test>
    <edit name="family" mode="assign" binding="same"><string>WenQuanYi Zen Hei</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>等线</string></test>
    <edit name="family" mode="assign" binding="same"><string>WenQuanYi Zen Hei</string></edit>
  </match>

</fontconfig>
